name: Android CI

on:
  push:
    branches: [main, 'feat/ui-*']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4 (Node 24)
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install project SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Test, lint and build
        run: bash ./gradlew --no-daemon --stacktrace test :app:lintDebug :app:assembleDebug
      - name: Record APK checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/hunterlab-debug.apk
          (cd dist && sha256sum hunterlab-debug.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'Development APK: CI debug certificate; update compatibility is unverified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload development APK and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hunterlab-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ github.sha }}
          path: |
            app/build/reports/
            core/build/reports/tests/
            protocol/build/reports/tests/
          retention-days: 14
